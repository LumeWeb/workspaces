; PHP-FPM configuration for the Pinner runtime.
;
; What matters here: listen on the loopback where Caddy forwards, and running
; workers as www-data. The FPM master is also started as www-data (after our
; privilege drop), so the pool user/group directives are ignored and the whole
; tree runs as www-data.
;
; error_log: the upstream default /proc/self/fd/2 is not reopenable by the
; non-root master (EACCES, the container stdout pipe is root-owned 0600), which
; aborts FPM startup. Point it at a www-data-writable path provisioned in the
; image (see Dockerfile) instead.
[global]
error_log = /var/www/log/php-fpm.log

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Same reopen-by-path constraint as the error log above: the default
; /proc/self/fd/2 (container stdout pipe) is not writable by the non-root pool,
; so log to the www-data-owned runtime dir instead.
access.log = /var/www/log/php-fpm-access.log

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

pm.max_requests = 500

catch_workers_output = yes
