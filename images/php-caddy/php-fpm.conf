; PHP-FPM configuration for the Pinner runtime.
;
; What matters here: listen on the loopback where Caddy forwards. The FPM
; master and pool run as www-data by construction: the entrypoint starts the
; master as www-data (after our privilege drop), so no pool user/group
; directives are set (they would be ignored and only emit NOTICEs).
;
; error_log: single sink for PHP application logs (error_log() calls, PHP
; warnings/errors captured from workers via catch_workers_output). This file
; is streamed to the container log stream (docker/Coolify `docker logs`,
; tagged "[php]") by the supervisor's relay — see pinner-supervise.sh. It is
; deliberately a file, not /proc/self/fd/2 like the official php images: the
; non-root master must open() the path itself (unlike Caddy, which inherits
; its fds), and the procfs reopen of the container's root-owned log pipe is
; nondeterministically denied for www-data (observed under docker compose and
; plain runs alike). A www-data-owned file is deterministic; the relay then
; makes the same bytes visible to the orchestrator.
[global]
error_log = /var/www/log/php-fpm.log

; Default FPM limit silently truncates captured worker output (PHP stack
; traces, error_log payloads) at 1024 chars — raise so troubleshooting data
; is not cut mid-line.
log_limit = 8192

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Same reopen-by-path constraint as the error log above: the default
; /proc/self/fd/2 (container stdout pipe) is not writable by the non-root pool,
; so log to the www-data-owned runtime dir instead.
access.log = /var/www/log/php-fpm-access.log

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

pm.max_requests = 500

catch_workers_output = yes
