; Pinner PHP runtime settings, tuned for a WordPress workspace.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; Error handling: PHP output is routed to the container log stream via
; PHP-FPM's error_log (see zz-pinner.conf / docker-entrypoint.sh), never to
; the HTTP response.
log_errors = On
display_errors = Off
display_startup_errors = Off
; Don't also forward PHP errors upstream as FastCGI stderr packets: FPM
; already captures worker errors via catch_workers_output (single copy in the
; container logs instead of a duplicate line from Caddy).
fastcgi.logging = Off

; OPCache: WordPress is PHP-heavy; enable and size the shared memory cache.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
