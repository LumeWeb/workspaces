name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: |
          Release version to build and push (e.g. 0.2.0). Required for manual
          runs; on a tag push the version is derived from the tag (v-prefix
          stripped) and this input is ignored.
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: lumeweb

jobs:
  release:
    name: Build + publish (amd64/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive recipe version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual run: use the explicit version input. On dispatch GITHUB_REF_NAME
            # is the branch name, NOT a tag, so we must not fall back to it.
            recipe="${{ inputs.version }}"
            if [[ -z "$recipe" ]]; then
              echo "::error::No version provided for manual release. Use the 'version' input (e.g. 0.2.0)." >&2
              exit 1
            fi
          else
            # Tag push (v*): derive from the tag, stripping the v-prefix.
            recipe="${GITHUB_REF_NAME#v}"
          fi
          echo "recipe=${recipe}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          # Pinned upstream inputs (PHP/Caddy/WordPress versions + digests) are
          # single-sourced in images/*/versions.env; bake reads them from the
          # process environment, so source+export them before building.
          set -a
          . images/php-caddy/versions.env
          . images/wordpress/versions.env
          set +a
          # VERSION is a bake HCL variable (read from the process environment),
          # so set it here: it drives both the `:${VERSION}` image tags and the
          # build-arg/label sourced from it. Setting only `--set *.args.VERSION`
          # would leave the release tags stuck at the bake default (0.1.0).
          VERSION="${{ steps.version.outputs.recipe }}" docker buildx bake --push \
            --set '*.platform=linux/amd64,linux/arm64' \
            php-caddy wordpress
      - name: Report digests
        run: |
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_OWNER/workspace-wordpress:${{ steps.version.outputs.recipe }}"
