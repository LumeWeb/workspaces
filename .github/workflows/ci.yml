name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (shellcheck + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -S warning images/*/*.sh scripts/*.sh
      - name: Run hadolint
        run: |
          set -e
          for f in images/*/Dockerfile; do
            docker run --rm -i -v "$PWD":/work -w /work \
              ghcr.io/hadolint/hadolint:latest hadolint --failure-threshold=error "$f"
          done

  pins:
    name: Verify upstream pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-pins.sh

  build-and-verify:
    name: Build + verify WordPress
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: make build
      - name: Verify php-caddy base
        run: make verify-php-caddy
      - name: Verify WordPress (Compose + MariaDB)
        run: make verify-wordpress
